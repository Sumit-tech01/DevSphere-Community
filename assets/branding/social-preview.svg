<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="devsphereSocialTitle devsphereSocialDesc">
  <title id="devsphereSocialTitle">DevSphere social preview</title>
  <desc id="devsphereSocialDesc">A premium midnight navy social card with the DevSphere sphere mark, the DEVSPHERE wordmark, the tagline Connect. Code. Collaborate. Create., and the community values Learn, Build, Collaborate, Create.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.58" stop-color="#0D1530"/>
      <stop offset="1" stop-color="#111C3A"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="88" y1="80" x2="460" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="dGradient" x1="200" y1="170" x2="345" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="300" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="sphereCore" cx="38%" cy="28%" r="82%">
      <stop offset="0" stop-color="#1E315F"/>
      <stop offset="0.5" stop-color="#111C3A"/>
      <stop offset="1" stop-color="#0B1020"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sphereClip">
      <circle cx="256" cy="256" r="162"/>
    </clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1040" cy="120" r="400" fill="url(#violetGlow)"/>
  <circle cx="230" cy="610" r="360" fill="url(#cyanGlow)"/>

  <!-- Header label -->
  <circle cx="93" cy="88" r="5" fill="#22D3EE"/>
  <text x="112" y="94" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#A5F3FC">GLOBAL DEVELOPER COMMUNITY</text>

  <!-- Headline -->
  <text x="86" y="282" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="98" font-weight="700" letter-spacing="2">
    <tspan fill="#F8FAFC">DEV</tspan><tspan fill="url(#wordGradient)">SPHERE</tspan>
  </text>

  <text x="90" y="348" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="3.4" fill="#CBD5E1">CONNECT. CODE. COLLABORATE. CREATE.</text>

  <text x="90" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94A3B8">A global community for developers, students,</text>
  <text x="90" y="442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94A3B8">and technology builders.</text>

  <!-- Value chips -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">
    <rect x="88" y="486" width="104" height="38" rx="19" fill="#2563EB" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="112" y="510" fill="#93C5FD">LEARN</text>
    <rect x="204" y="486" width="100" height="38" rx="19" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.32"/>
    <text x="224" y="510" fill="#A5F3FC">BUILD</text>
    <rect x="316" y="486" width="158" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.36"/>
    <text x="336" y="510" fill="#C4B5FD">COLLABORATE</text>
    <rect x="486" y="486" width="108" height="38" rx="19" fill="#F8FAFC" fill-opacity="0.04" stroke="#94A3B8" stroke-opacity="0.28"/>
    <text x="506" y="510" fill="#E2E8F0">CREATE</text>
  </g>

  <text x="90" y="585" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" letter-spacing="0.2" fill="#64748B">github.com/Sumit-tech01/DevSphere-Community</text>

  <line x1="746" y1="136" x2="746" y2="504" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Large sphere mark -->
  <g transform="translate(772 108) scale(0.82)">
    <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ringGradient)" stroke-opacity="0.16" stroke-width="1.5"/>
    <ellipse cx="256" cy="256" rx="238" ry="76" transform="rotate(-24 256 256)" fill="none" stroke="#22D3EE" stroke-opacity="0.36" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="238" ry="80" transform="rotate(58 256 256)" fill="none" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="256" cy="256" r="164" fill="url(#sphereCore)" stroke="url(#ringGradient)" stroke-width="2.8"/>
    <path d="M146 120A162 162 0 0 1 358 128" fill="none" stroke="#F8FAFC" stroke-opacity="0.24" stroke-width="2" stroke-linecap="round"/>
    <g clip-path="url(#sphereClip)">
      <g fill="none" stroke="#67E8F9" stroke-opacity="0.14" stroke-width="1.3">
        <ellipse cx="256" cy="256" rx="56" ry="162"/>
        <ellipse cx="256" cy="256" rx="112" ry="162"/>
        <ellipse cx="256" cy="256" rx="162" ry="48"/>
        <ellipse cx="256" cy="256" rx="162" ry="98"/>
        <line x1="94" y1="256" x2="418" y2="256"/>
        <line x1="256" y1="94" x2="256" y2="418"/>
      </g>
      <g fill="none" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.8">
        <path d="M176 190 246 158 326 200 334 286 278 342 188 318Z"/>
        <path d="M256 256 176 190M256 256 326 200M256 256 278 342M256 256 188 318"/>
      </g>
      <path d="M200 166V346H246C312 346 346 308 346 256C346 204 312 166 246 166Z" fill="none" stroke="url(#dGradient)" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
      <g>
        <circle cx="176" cy="190" r="13" fill="#22D3EE" fill-opacity="0.12"/>
        <circle cx="176" cy="190" r="5.5" fill="#67E8F9"/>
        <circle cx="246" cy="158" r="12" fill="#8B5CF6" fill-opacity="0.14"/>
        <circle cx="246" cy="158" r="5" fill="#A78BFA"/>
        <circle cx="326" cy="200" r="14" fill="#22D3EE" fill-opacity="0.12"/>
        <circle cx="326" cy="200" r="6" fill="#22D3EE"/>
        <circle cx="334" cy="286" r="11" fill="#2563EB" fill-opacity="0.2"/>
        <circle cx="334" cy="286" r="4.5" fill="#60A5FA"/>
        <circle cx="278" cy="342" r="13" fill="#8B5CF6" fill-opacity="0.14"/>
        <circle cx="278" cy="342" r="5.5" fill="#A78BFA"/>
        <circle cx="188" cy="318" r="11" fill="#22D3EE" fill-opacity="0.12"/>
        <circle cx="188" cy="318" r="4.5" fill="#67E8F9"/>
        <circle cx="256" cy="256" r="17" fill="#2563EB" fill-opacity="0.18"/>
        <circle cx="256" cy="256" r="6.5" fill="#F8FAFC"/>
      </g>
    </g>
    <circle cx="94" cy="344" r="5" fill="#22D3EE"/>
    <circle cx="426" cy="170" r="4" fill="#A78BFA"/>
    <circle cx="108" cy="154" r="3.5" fill="#60A5FA"/>
  </g>
</svg>
